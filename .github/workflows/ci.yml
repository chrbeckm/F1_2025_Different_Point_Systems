name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: vendor/bundle
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check number of available cores
        run: echo $(nproc)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r .github/workflows/requirements.txt

      - name: Generate images
        run: make -j $(nproc)

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Remove unnecessary files
        run: |
          rm -f LICENSE
          rm -f Makefile
          rm -f README.md
          rm -rf helpfiles
          rm -rf python_scripts
          rm -rf results

      - name: Remove plots from includes dir
        run: |
          find _includes -type f -name "*.png" -exec rm -f {} +
          find _includes -type f -name "*.pdf" -exec rm -f {} +

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
